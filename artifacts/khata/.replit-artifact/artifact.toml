kind = "web"
previewPath = "/"
title = "Khata"
version = "1.0.0"
id = "artifacts/khata"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21533

[services.development]
run = "npm run dev --workspace=@workspace/khata"

[services.production]
build = [ "npm", "run", "build", "--workspace=@workspace/khata" ]
serve = "static"
publicDir = "artifacts/khata/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21533"
BASE_PATH = "/"
